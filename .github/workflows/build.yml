name: Build Shadow-SIP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - name: Generate native runners
        shell: pwsh
        run: .\scripts\setup_platforms.ps1
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        run: flutter test --no-pub
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-sip-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - name: Accept Android SDK licences
        run: yes | flutter doctor --android-licenses || true
      - name: Generate native runners
        run: pwsh -File ./scripts/setup_platforms.ps1
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        run: flutter test --no-pub
      - name: Build Android release APK
        run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-sip-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
