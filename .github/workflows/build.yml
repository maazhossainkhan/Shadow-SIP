name: Shadow-SIP Windows and Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true
      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses || true
      - name: Install Android native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Prepare Shadow-SIP branding
        run: pwsh -File ./scripts/prepare-shadow.ps1
      - name: Apply local 3-way audio engine
        run: python ./scripts/apply-local-conference.py
      - name: Build patched Medut Android audio libraries
        run: bash sdk/Medut-SDK/scripts/build-android.sh
      - name: Dependencies, analysis and tests
        working-directory: upstream/medut-softphone
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build release APK
        working-directory: upstream/medut-softphone
        run: flutter build apk --release --dart-define=SHADOW_SIP_VERSION=0.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-sip-android-apk
          path: upstream/medut-softphone/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true
      - name: Prepare Shadow-SIP branding
        shell: pwsh
        run: .\scripts\prepare-shadow.ps1
      - name: Apply local 3-way call management
        run: python ./scripts/apply-local-conference.py
      - name: Dependencies, analysis and tests
        working-directory: upstream/medut-softphone
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build release Windows app
        working-directory: upstream/medut-softphone
        run: flutter build windows --release --dart-define=SHADOW_SIP_VERSION=0.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-sip-windows-x64
          path: upstream/medut-softphone/build/windows/x64/runner/Release/
          if-no-files-found: error
